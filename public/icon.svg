<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="110" fill="url(#greenGrad)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="16" y="16" width="480" height="480" rx="94" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.15"/>
  
  <!-- Central Icon: Cash Register & Store Shopping Bag -->
  <g filter="url(#shadow)" transform="translate(106, 96)">
    <!-- Store Roof / Awning -->
    <path d="M20 90 L150 20 L280 90 Z" fill="#facc15" stroke="#ca8a04" stroke-width="6" stroke-linejoin="round"/>
    <!-- Store Pillars / Main Box -->
    <rect x="40" y="90" width="220" height="180" rx="16" fill="#ffffff"/>
    <!-- Cash Register Screen / Header -->
    <rect x="65" y="115" width="170" height="50" rx="8" fill="#15803d"/>
    <text x="150" y="148" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" text-anchor="middle" letter-spacing="2">BERKAH</text>
    
    <!-- POS keypad buttons -->
    <rect x="65" y="180" width="40" height="24" rx="4" fill="#e2e8f0"/>
    <rect x="115" y="180" width="40" height="24" rx="4" fill="#e2e8f0"/>
    <rect x="165" y="180" width="70" height="24" rx="4" fill="#22c55e"/>
    
    <rect x="65" y="215" width="40" height="24" rx="4" fill="#e2e8f0"/>
    <rect x="115" y="215" width="40" height="24" rx="4" fill="#e2e8f0"/>
    <rect x="165" y="215" width="70" height="24" rx="4" fill="#0f766e"/>

    <!-- Cash drawer tray line -->
    <rect x="55" y="250" width="190" height="12" rx="4" fill="#cbd5e1"/>
    <circle cx="150" cy="256" r="3" fill="#64748b"/>
  </g>
  
  <!-- Floating Coin Badge -->
  <g filter="url(#shadow)" transform="translate(320, 310)">
    <circle cx="50" cy="50" r="48" fill="#fbbf24" stroke="#d97706" stroke-width="4"/>
    <circle cx="50" cy="50" r="38" fill="none" stroke="#fef08a" stroke-width="2"/>
    <text x="50" y="62" fill="#78350f" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" text-anchor="middle">Rp</text>
  </g>
</svg>
